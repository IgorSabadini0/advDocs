services:
  db:
    image: mysql:8.0
    container_name: advdocs
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-${PORT:-3306}}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
