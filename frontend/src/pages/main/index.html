<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relação de Pastas | Palhares Ferreira Advocacia</title>
    <link rel="stylesheet" href="css/pastas.css">
    <link rel="shortcut icon" href="/assets/logo.svg" type="image/svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/a8f4be2bb0.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">

        <div class="header-controls">

            <div class="brand-logo">
                <img src="/assets/logo.svg" alt="Logo Palhares Ferreira">
            </div>

            <div class="search-bar">
                <div class="pesquisa">
                    <input type="text" id="search" placeholder="Pesquisar (Pastas, Clientes...)"
                        onkeypress="handleKeyPress(event)">
                </div>

                <div class="lupa" onclick="buscar()" style="cursor: pointer;">
                    <abbr title="Pesquisar pastas, clientes ou documentos" style="text-decoration: none;">
                        <button class="btn-lupa" aria-label="Buscar">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                    </abbr>
                </div>

                <div class="add" onclick="adicionar()" style="cursor: pointer;">
                    <abbr title="Adicionar nova pasta, cliente ou documento" style="text-decoration: none;">
                        <button class="btn-add" aria-label="Adicionar">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </abbr>
                </div>

                <div class="config" onclick="config()" style="cursor: pointer;">
                    <abbr title="Configurações" style="text-decoration: none;">
                        <button class="btn-config" aria-label="Configurações">
                            <i class="fa-solid fa-gear"></i>
                        </button>
                    </abbr>
                </div>
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterResults('all')">Todos</button>
                <button class="filter-btn" onclick="filterResults('previdenciario')">Previdenciário</button>
                <button class="filter-btn" onclick="filterResults('santa_casa')">Santa Casa</button>
                <button class="filter-btn" onclick="filterResults('justica_gratuita')">Justiça Gratuita</button>
                <button class="filter-btn" onclick="filterResults('arquivado')">Arquivado</button>
                <button class="filter-btn" onclick="filterResults('outro')">Outro</button>
            </div>

        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">Buscando documentos...</p>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="results-count" id="resultsCount"></div>

            <div class="results-grid" id="resultsGrid"></div>
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <p></p>
        </div>

    </div>

    <script src="js/pastas.js"></script>
</body>

</html>
