<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relação de Pastas | Palhares Ferreira Advocacia</title>
    <link rel="stylesheet" href="css/pastas.css">
    <link rel="shortcut icon" href="/assets/logo.svg" type="image/svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/a8f4be2bb0.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="bg-mesh"></div>

    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">
            <div class="brand-logo">
                <img src="/assets/logo.svg" alt="Logo Palhares Ferreira">
                <span class="brand-text">Palhares Ferreira <strong class="gold-text">Advocacia</strong></span>
            </div>

            <div class="nav-actions">
                <button class="btn-nav btn-add-nav" onclick="adicionar()" title="Adicionar novo registro">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nova Pasta</span>
                </button>
                <button class="btn-nav btn-config-nav" onclick="config()" title="Configurações">
                    <i class="fa-solid fa-sliders"></i>
                </button>
                <button class="btn-nav btn-logout-nav" onclick="sair()" title="Sair do sistema">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Dashboard Welcome & Stats -->
        <section class="dashboard-intro">
            <div class="welcome-text">
                <h1>Painel de Controle</h1>
                <p>Monitore e gerencie os registros e pastas do escritório</p>
            </div>

            <!-- Statistics Cards Grid -->
            <div class="stats-grid">
                <div class="stat-card gold-glow">
                    <div class="stat-icon"><i class="fa-solid fa-folder-closed"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Total de Pastas</span>
                        <h2 class="stat-value" id="stat-total">-</h2>
                    </div>
                </div>

                <div class="stat-card success-glow">
                    <div class="stat-icon"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Casos Ativos</span>
                        <h2 class="stat-value" id="stat-ativos">-</h2>
                    </div>
                </div>

                <div class="stat-card info-glow">
                    <div class="stat-icon"><i class="fa-solid fa-circle-pause"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Casos Parados</span>
                        <h2 class="stat-value" id="stat-parados">-</h2>
                    </div>
                </div>
            </div>
        </section>

        <!-- Search and Filter Control Center -->
        <section class="control-panel">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search"
                    placeholder="Pesquise por nome do cliente, número do processo ou pasta..."
                    onkeypress="handleKeyPress(event)">
                <button class="search-btn" onclick="buscar()">Pesquisar</button>
            </div>

            <div class="filter-wrapper">
                <span class="filter-title"><i class="fa-solid fa-filter"></i> Filtrar por categoria:</span>
                <div class="filter-buttons">
                    <button class="filter-btn active" onclick="filterResults('all')">Todos</button>
                    <button class="filter-btn" onclick="filterResults('previdenciario')">Previdenciário</button>
                    <button class="filter-btn" onclick="filterResults('santa_casa')">Santa Casa</button>
                    <button class="filter-btn" onclick="filterResults('justica_gratuita')">Justiça Gratuita</button>
                    <button class="filter-btn" onclick="filterResults('arquivado')">Arquivado</button>
                    <button class="filter-btn" onclick="filterResults('outro')">Outro</button>
                </div>
            </div>
        </section>

        <!-- Loader -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">Buscando registros...</p>
        </div>

        <!-- Results Section -->
        <main class="results-container" id="resultsContainer">
            <div class="results-header">
                <div class="results-count" id="resultsCount"></div>
            </div>

            <div class="results-grid" id="resultsGrid"></div>
        </main>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <p class="empty-message"></p>
        </div>

    </div>

    <script src="js/pastas.js"></script>
</body>

</html>
