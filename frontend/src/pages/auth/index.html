<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="advDocs">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <title>Relação de Pastas - Palhares Ferreira Advocacia</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('advdocs-theme') || 'system';
                var resolved = saved === 'system'
                    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : saved;
                document.documentElement.setAttribute('data-theme', resolved === 'dark' ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme-preference', saved);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="/assets/logo.svg" type="image/svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://ka-f.fontawesome.com" crossorigin>
    <script src="https://kit.fontawesome.com/a8f4be2bb0.js" crossorigin="anonymous" defer></script>
</head>

<body>
    <div class="bg-mesh"></div>
    <div class="container">
        <div class="login-card">
            <div class="logo">
                <img src="/assets/logo.svg" alt="Palhares Ferreira Logo">
                <span class="brand-name">Palhares Ferreira <strong>Advocacia</strong></span>
            </div>

            <p class="subtitle">Gestão Documental</p>

            <div class="input-group">
                <i class="fa-solid fa-user field-icon"></i>
                <input type="text" placeholder="Usuário" id="user" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock field-icon"></i>
                <input type="password" placeholder="Senha" id="password" required>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>

            <div class="enter">
                <button type="submit" id="submit" class="btn-submit">
                    <span>Entrar</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </div>

            <div class="status-grid">
                <p id="status" class="status"></p>
            </div>
        </div>
    </div>
    <script src="js/script.js" type="module"></script>
</body>

</html>
