<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Pasta | Palhares Ferreira Advocacia</title>
    <link rel="stylesheet" href="css/register.css">
    <link rel="shortcut icon" href="/assets/logo.svg" type="image/svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/a8f4be2bb0.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="bg-mesh"></div>
    <div class="container">
        <div class="brand-logo">
            <img src="/assets/logo.svg" alt="Logo Palhares Ferreira">
            <span class="title-page">Novo Registro</span>
        </div>

        <div class="clientes-add">
            <div class="form-group">
                <label for="acao"><i class="fa-solid fa-gavel"></i> Ação <span class="obrigatorio">*</span></label>
                <input type="text" id="acao" required placeholder="Ex: Ação Revisional">
            </div>

            <div class="form-group">
                <label for="nome"><i class="fa-solid fa-user-tie"></i> Nome do Cliente <span
                        class="obrigatorio">*</span></label>
                <input type="text" id="nome" required placeholder="Nome completo do cliente">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="numeroPasta"><i class="fa-solid fa-folder-open"></i> Número da Pasta</label>
                    <input type="number" id="numeroPasta" placeholder="Ex: 1">
                </div>

                <div class="form-group">
                    <label for="tipo"><i class="fa-solid fa-tags"></i> Tipo de Registro <span
                            class="obrigatorio">*</span></label>
                    <select name="tipo" id="tipo" required>
                        <option value="" disabled selected hidden>Selecione...</option>
                        <option value="Todos Processos">Todos Processos</option>
                        <option value="Previdenciário">Previdenciário</option>
                        <option value="Santa Casa">Santa Casa</option>
                        <option value="Justiça Gratuita">Justiça Gratuita</option>
                        <option value="Arquivado">Arquivado</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="numeroProc"><i class="fa-solid fa-scale-balanced"></i> Número do Processo</label>
                    <input type="text" id="numeroProc" placeholder="Ex: 1234567-00.2026.8.26.0000" maxlength="25">
                </div>

                <div class="form-group">
                    <label for="status"><i class="fa-solid fa-circle-info"></i> Status Atual</label>
                    <select name="status" id="status">
                        <option value="" disabled selected hidden>Selecione...</option>
                        <option value="Ativo">Ativo</option>
                        <option value="Parado">Parado</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="descricao"><i class="fa-solid fa-align-left"></i> Descrição Adicional</label>
                <input type="text" id="descricao" placeholder="Breve resumo sobre o caso">
            </div>

            <button class="btn-save" id="saveButton">
                <i class="fa-solid fa-floppy-disk"></i> Salvar Registro
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>

        <div class="status-message">
            <p id="response"></p>
        </div>

        <a href="../main" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Voltar para o painel
        </a>
    </div>

    <script src="js/register.js"></script>
</body>

</html>
