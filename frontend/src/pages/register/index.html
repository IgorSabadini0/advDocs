<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Pasta | Palhares Ferreira Advocacia</title>
    <link rel="stylesheet" href="css/register.css">
    <link rel="shortcut icon" href="/assets/logo.svg" type="image/svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/a8f4be2bb0.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="bg-mesh"></div>
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <div class="container">
        <div class="register-header">
            <div class="brand-logo">
                <img src="/assets/logo.svg" alt="Logo Palhares Ferreira">
                <span class="title-page">Novo Registro de Pasta</span>
                <p class="subtitle-page">Preencha os dados abaixo para cadastrar uma nova pasta no escritório</p>
            </div>
        </div>

        <form id="registerForm" class="clientes-add" novalidate>
            <div class="form-group">
                <label for="acao"><i class="fa-solid fa-gavel"></i> Ação <span class="obrigatorio">*</span></label>
                <input type="text" id="acao" required maxlength="128" placeholder="Ex: Ação Revisional, Inventário, Divórcio Consensual...">
            </div>

            <div class="form-group">
                <label for="nome"><i class="fa-solid fa-user-tie"></i> Nome do Cliente <span
                        class="obrigatorio">*</span></label>
                <input type="text" id="nome" required maxlength="128" placeholder="Nome completo do cliente">
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <div class="label-with-action">
                        <label for="numeroPasta"><i class="fa-solid fa-folder-open"></i> Número da Pasta <span
                                class="obrigatorio">*</span></label>
                        <button type="button" class="btn-novo-tipo" id="btnSugerirPasta" title="Buscar menor número de pasta livre">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Sugerir livre
                        </button>
                    </div>
                    <input type="number" id="numeroPasta" min="1" required placeholder="Ex: 1">
                </div>

                <div class="form-group">
                    <div class="label-with-action">
                        <label for="tipo"><i class="fa-solid fa-tags"></i> Tipo de Registro <span
                                class="obrigatorio">*</span></label>
                        <button type="button" class="btn-novo-tipo" id="btnNovoTipo" title="Cadastrar novo tipo de processo">
                            <i class="fa-solid fa-plus"></i> Novo Tipo
                        </button>
                    </div>
                    <select name="tipo" id="tipo" required>
                        <option value="" disabled selected hidden>Carregando tipos...</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <div class="label-with-action">
                        <label for="numeroProc"><i class="fa-solid fa-scale-balanced"></i> Número do Processo</label>
                        <span class="cnj-counter-badge" id="cnjCounterBadge">Opcional</span>
                    </div>
                    <input type="text" id="numeroProc" placeholder="0000000-00.0000.0.00.0000" maxlength="25">
                </div>

                <div class="form-group">
                    <label for="status"><i class="fa-solid fa-circle-info"></i> Status Atual <span
                            class="obrigatorio">*</span></label>
                    <select name="status" id="status" required>
                        <option value="Ativo" selected>Ativo</option>
                        <option value="Parado">Parado</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="descricao"><i class="fa-solid fa-align-left"></i> Descrição / Observações</label>
                <textarea id="descricao" rows="3" placeholder="Breve resumo sobre o caso, vara, pendências ou observações relevantes..."></textarea>
            </div>

            <label class="datajud-toggle-card" for="consultarProcesso">
                <div class="checkbox-group">
                    <input type="checkbox" id="consultarProcesso">
                </div>
                <div class="datajud-toggle-info">
                    <strong><i class="fa-solid fa-magnifying-glass"></i> Sincronizar com a API Pública do DataJud (CNJ)</strong>
                    <span>Preenche automaticamente a descrição com Tribunal, Classe, Órgão Julgador e última movimentação caso a descrição esteja em branco.</span>
                </div>
            </label>

            <div class="status-message" id="responseBox" style="display: none;">
                <p id="response"></p>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div class="loading-register-info">
                    <span id="loadingRegisterText">Processando registro...</span>
                    <span class="loading-timer-pill" id="loadingRegisterTimer" style="display: none;">0s</span>
                </div>
            </div>

            <div class="form-group">
                <button type="submit" class="btn-save" id="saveButton">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar Registro
                </button>
            </div>

            <div class="navigation-links">
                <a href="../consult" id="backToConsultLink" class="back-link back-link-consult" style="display: none;">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span id="backToConsultText">Voltar para a consulta do processo</span>
                </a>

                <a href="../main" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i> Voltar para o Painel de Pastas
                </a>
            </div>
        </form>
    </div>

    <script src="js/register.js" type="module"></script>
</body>

</html>
