<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Pasta | Palhares Ferreira Advocacia</title>
    <link rel="stylesheet" href="css/register.css">
    <link rel="shortcut icon" href="../../assets/logo.svg" type="image/svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/a8f4be2bb0.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <div class="brand-logo">
            <img src="../../assets/logo.svg" alt="Logo Palhares Ferreira">
            <span class="title-page">Registrar Pasta</span>
        </div>

        <div class="clientes-add">
            <label for="titulo">Título da Pasta / Documento <span class="obrigatorio">*</span></label>
            <input type="text" id="titulo" required placeholder="Ex: Ação Revisional - Nome do Cliente">

            <label for="numeroPasta">Número da Pasta</label>
            <input type="text" id="numeroPasta" placeholder="Ex: nº 1">

            <label for="nome">Nome do Cliente <span class="obrigatorio">*</span></label>
            <input type="text" id="nome" required placeholder="Nome completo do cliente">

            <label for="tipo">Tipo de Registro <span class="obrigatorio">*</span></label>
            <select name="tipo" id="tipo" required>
                <option value="" disabled selected hidden>Selecione o tipo...</option>
                <option value="pasta">Pasta</option>
                <option value="cliente">Cliente</option>
                <option value="documento">Documento</option>
            </select>

            <label for="numero">Número do Processo</label>
            <input type="text" id="numeroProc" placeholder="Ex: 0001-2026 / Processo nº">

            <label for="status">Status Atual</label>
            <select name="status" id="status">
                <option value="" disabled selected hidden>Selecione o status...</option>
                <option value="Ativo">Ativo</option>
                <option value="Arquivado">Arquivado</option>
            </select>

            <label for="descricao">Descrição Adicional</label>
            <input type="text" id="descricao" placeholder="Breve resumo sobre o caso">

            <button class="btn-save" onclick="salvarRegistro()">
                <i class="fa-solid fa-floppy-disk"></i> Salvar Registro
            </button>
        </div>

        <div class="status-message">
            <p id="response"></p>
        </div>

        <a href="../main/index.html" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Voltar para a listagem
        </a>
    </div>

    <script src="js/register.js"></script>
</body>

</html>
