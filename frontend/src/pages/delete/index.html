<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Pasta | Palhares Ferreira Advocacia</title>
    <link rel="stylesheet" href="css/delete.css">
    <link rel="shortcut icon" href="../../assets/logo.svg" type="image/svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/a8f4be2bb0.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <div class="brand-logo">
            <img src="../../assets/logo.svg" alt="Logo Palhares Ferreira">
            <span class="title-page">Excluir Pasta</span>
            <div class="clientes-delete">
                <label for="idInput">ID do Registro <span class="obrigatorio">*</span></label>
                <input type="text" id="idInput" required placeholder="Ex: 1">

                <p id="response"></p>

                <button class="btn-delete" onclick="excluirRegistro()">
                    <i class="fa-solid fa-trash"></i> Excluir Registro
                </button>

                <a href="../main" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i> Voltar para a listagem
                </a>

            </div>
        </div>
        <script src="js/delete.js"></script>
</body>

</html>
