<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palhares Ferreira Advocacia - Gestão Documental</title>
    <!-- Script externo de gateway para conformidade total com Content Security Policy (CSP) -->
    <script src="/gateway.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b111e;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="spinner"></div>
</body>

</html>
