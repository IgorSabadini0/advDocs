<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="advDocs">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="shortcut icon" href="/assets/logo.svg" type="image/svg+xml">
    <title>Palhares Ferreira Advocacia - Gestão Documental</title>
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('advdocs-theme') || 'system';
                var resolved = saved === 'system'
                    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : saved;
                document.documentElement.setAttribute('data-theme', resolved === 'dark' ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme-preference', saved);
            } catch (e) {}
        })();
    </script>
    <!-- Script externo de gateway para conformidade total com Content Security Policy (CSP) -->
    <script src="/gateway.js"></script>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        html[data-theme="dark"] body {
            background-color: #0f172a;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(196, 146, 56, 0.25);
            border-top-color: #c49238;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        html[data-theme="dark"] .spinner {
            border-color: rgba(218, 176, 99, 0.2);
            border-top-color: #dab063;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="spinner"></div>
</body>

</html>
